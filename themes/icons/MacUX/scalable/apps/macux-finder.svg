<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MacUX Finder icon — two-tone face, macOS style -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#65bcf9"/>
      <stop offset="100%" style="stop-color:#1d7bd4"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8ea"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <!-- Left half face (blue tint) -->
  <path d="M 256 100 L 256 412 Q 160 412 130 380 Q 100 348 100 256 Q 100 164 130 132 Q 160 100 256 100 Z"
        fill="#1d7bd4" opacity="0.25"/>
  <!-- Face shape -->
  <ellipse cx="256" cy="270" rx="140" ry="150" fill="url(#faceGrad)"/>
  <!-- Left eye (dark blue half) -->
  <circle cx="210" cy="230" r="26" fill="#1d7bd4"/>
  <circle cx="218" cy="222" r="8"  fill="white"/>
  <!-- Right eye (white half) -->
  <circle cx="302" cy="230" r="26" fill="#1d7bd4"/>
  <circle cx="310" cy="222" r="8"  fill="white"/>
  <!-- Smile -->
  <path d="M 200 300 Q 256 352 312 300" stroke="#1d7bd4" stroke-width="14"
        stroke-linecap="round" fill="none"/>
  <!-- Left face is darker -->
  <path d="M 256 120 L 256 420 Q 118 420 116 256 Q 116 136 190 115 Z"
        fill="#1565c0" opacity="0.18"/>
</svg>
