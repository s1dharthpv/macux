<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  MacUX Font Configuration
  Installed to: ~/.config/fontconfig/conf.d/90-macux.conf

  Configures SF Pro Display / SF Pro Text as the preferred sans-serif font.
  Falls back to Inter → Cantarell → system sans.
  Enables LCD subpixel antialiasing for crisp rendering at small sizes.
-->
<fontconfig>

  <!-- ── Font family preference chain ──────────────────────────────────── -->

  <!-- Map generic 'sans-serif' to SF Pro -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
      <string>SF Pro Text</string>
      <string>Inter</string>
      <string>Inter Variable</string>
      <string>Cantarell</string>
    </edit>
  </match>

  <!-- Map 'system-ui' to SF Pro -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
      <string>SF Pro Text</string>
      <string>Inter</string>
    </edit>
  </match>

  <!-- Use SF Pro Text (optimized for body text) at small sizes -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>SF Pro Display</string>
    </test>
    <test name="size" compare="less_eq">
      <double>19.0</double>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <!-- ── Rendering quality ───────────────────────────────────────────────── -->

  <match target="font">
    <!-- Enable antialiasing -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <!-- LCD subpixel rendering (RGB order for most displays) -->
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <!-- LCD filter for fringes -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <!-- Slight hinting for crisp stems -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <!-- Allow embedded bitmaps for emoji/icons -->
    <edit name="embeddedbitmap" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- Disable hinting for large display text (>= 24pt) -->
  <match target="font">
    <test name="size" compare="more_eq">
      <double>24.0</double>
    </test>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
  </match>

  <!-- ── SF Mono for monospace ──────────────────────────────────────────── -->

  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Mono</string>
      <string>JetBrains Mono</string>
      <string>Fira Code</string>
      <string>Liberation Mono</string>
    </edit>
  </match>

</fontconfig>
